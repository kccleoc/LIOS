# LIOS v7.0 — State Contract
# Every field marked # TODO must be populated by the user.
# This file is the schema. Copy examples/state.example.yaml for a populated demo.
# NEVER commit a real state file to the public framework repo.

version: "v7.0"  # SSOT schema version (not the framework version)

# ── Valuation ──────────────────────────────────────────────────────────────
nlv: 0                        # TODO: Σ(position.market_value) + cash
as_of: "YYYY-MM-DD"           # TODO: price date
source: ""                    # TODO: broker / print source

# ── Sleeves ────────────────────────────────────────────────────────────────
# Three sleeves, one denominator: NLV. A + B is the risky block. C is the
# defensive block and the RESIDUAL: c = 100% − risky − 0, i.e. whatever A and B
# do not take. B is cap-only: no target, no Top-up, ever (P2′, P6′).
sleeves:
  a:
    target_pct: 0             # residual: risky_target − B_actual; never hand-set
    thematic_max_pct: 0       # TODO: thematic share of sleeve A (P1′)
    allocation:               # within-sleeve weights must sum to 100
      - ticker: "EXAMPLE-A1"  # TODO
        target_pct: 0
  b:
    ceiling_pct: 0            # TODO: soft ceiling — 10% of NLV by default (P6′)
    position_cap_pct: 0       # TODO: single-name effective exposure ceiling
    names_max: 0              # TODO: maximum name count
    names:                    # individual companies; no target, no equal weight
      - ticker: "EXAMPLE-B1"  # TODO: written thesis and break condition live in
                              # research records, append-only and versioned
  c:
    # No target_pct. No floor. No ceiling. C is the residual.
    duration_band:            # P6′ — the only control inside C
      min_years: 1            # average must not fall below this
      max_years: 6            # average must not exceed this
    duration_single_max_years: 10   # hard cap on any one holding
    # Composition is reported, never targeted: no cash target, no bond target,
    # no sub-sleeve. Cash, bills and bonds are all C.

# ── Constraints ────────────────────────────────────────────────────────────
constraints:
  lookthrough_company_cap_pct: 0   # TODO: single-company exposure cap — direct +
                                   # fund look-through + index-embedded (P6′)
  factor_cap_pct: 0           # TODO: single-sector exposure ceiling
  sector_basis: ""            # TODO: the taxonomy that cap is measured on
                              # (gics_industry_group by default). A cap with no
                              # recorded basis is NON-COMPLIANT, not passing.
  rebalance_tolerance_pct: 2.5   # soft-limit tolerance; inside = report, not trade
  us_situs_ceiling: 0         # TODO: estate-tax exemption in your jurisdiction
  us_situs_stop_line: 0       # TODO: 80% of the ceiling
  us_situs_exposure: 0        # TODO: US-domiciled positions + broker cash (book figure)
  true_us_situs: 0            # TODO: book figure + listed external holdings
  us_situs_includes_cash: false   # TODO: confirm with the custodian

# ── Glidepath ──────────────────────────────────────────────────────────────
glidepath:
  policy: contribution_tilt      # contribution_tilt | hard (hard lifts the P4′
                                 # prohibition on selling A into C)
  bands:                      # TODO: one row per age band; risky + c = 100
    - age_min: 45
      age_max: 49             # TODO: non-overlapping bands (45–49, 50–54, 55–59, 60–64, 65+)
      risky: 0                # TODO: total risky weight (A + B), set by age (P2′)
      b_ceiling: 10           # TODO: Sleeve B ceiling within the band (10% at every age)
      # a = risky − b_actual,  c = 100 − risky. Both residual, neither stored.

# ── Contributions ──────────────────────────────────────────────────────────
monthly_dca: 0                # TODO: current monthly contribution
dca_step_up: "0%"   # TODO: fixed owner-declared rate, 0–5%, floored at zero
dca_review_month: 1

# ── Regime Index (dashboard, gates nothing) ────────────────────────────────
regime:
  as_of: "YYYY-MM-DD"
  market_valuation: 0         # TODO 0-100, higher = more bearish
  portfolio_valuation: 0
  macro_liquidity: 0
  technical: 0
  opportunity: 0
  weighted: 0                 # 0.30/0.25/0.20/0.15/0.10
  band: ""                    # Risk-On | Constructive | Cautious | Defensive

# ── Positions ──────────────────────────────────────────────────────────────
positions:
  - ticker: "EXAMPLE-A1"
    sleeve: a                 # a | b | c
    shares: 0
    avg_cost: 0
    market_price: 0
    market_value: 0
    us_situs: false           # true if US-domiciled ETF or US corporation
    listing_venue: ""         # TODO: LSE | US — venue-aware execution windows
    thematic_block: false     # TODO: true for sector/thematic holdings inside A
    within_a_target_pct: 0    # TODO: within-A target weight (A lines only)
    thesis: ""                # TODO: B lines — written thesis, append-only, versioned
    break_condition: ""       # TODO: B lines — invalidation condition, append-only, versioned
    duration_years: 0         # REQUIRED for sleeve c — effective duration from
                              # the fact sheet; 0 for cash. Check 11 aborts without it

# ── Cash ───────────────────────────────────────────────────────────────────
cash:
  balance: 0                  # uninvested broker cash; belongs to C
  # No separate vehicle list. A money-market or T-bill fund is a position in C,
  # with its own duration_years.

# ── Computed (do not hand-edit) ────────────────────────────────────────────
portfolio_total: 0            # Σ market_value + cash
reconciliation_delta: 0       # nlv − portfolio_total (≤ ±1.00)
