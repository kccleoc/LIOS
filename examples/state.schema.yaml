# LIOS v3.0 — State Contract
# Every field marked # TODO must be populated by the user.
# This file is the schema. Copy examples/state.example.yaml for a populated demo.
# NEVER commit a real state file to the public framework repo.

version: "v3.0"

# ── Valuation ──────────────────────────────────────────────────────────────
nlv: 0                        # TODO: Σ(position.market_value) + Σ(cash pools)
as_of: "YYYY-MM-DD"           # TODO: price date
source: ""                    # TODO: broker / print source

# ── Sleeves ────────────────────────────────────────────────────────────────
# One denominator: NLV. Targets must sum to 100.
sleeves:
  a:
    target_pct: 0             # TODO: core index weight
    allocation:               # within-sleeve weights must sum to 100
      - ticker: "EXAMPLE-A1"  # TODO
        target_pct: 0
  b:
    target_pct: 0             # TODO: conviction weight (1-4 names)
    position_cap_pct: 0       # TODO: single-name EFFECTIVE exposure ceiling
    names:                    # 1-4; equal weight at entry
      - ticker: "EXAMPLE-B1"  # TODO
        target_pct: 0
  c:
    target_pct: 0             # TODO: satellite weight
    ceiling_pct: 0            # TODO: hard ceiling
    max_names: 0              # TODO
  d:
    target_pct: 0             # TODO: duration weight
    instrument: "EXAMPLE-D"   # TODO: >3y duration, hedged
  z:
    target_pct: 0             # TODO: cash equivalents
    floor_pct: 0              # TODO
    ceiling_pct: 0            # TODO

# ── Constraints ────────────────────────────────────────────────────────────
constraints:
  factor_cap_pct: 0           # TODO: single-factor exposure ceiling
  risky_min_pct: 0            # TODO: total risky weight floor
  risky_max_pct: 0            # TODO: total risky weight ceiling
  # bands are computed: clamp(0.5 × target, 2pp, 8pp)
  us_situs_ceiling: 0         # TODO: estate-tax exemption in your jurisdiction
  us_situs_exposure: 0        # TODO: current US-domiciled ETFs + US shares

# ── Glidepath ──────────────────────────────────────────────────────────────
glidepath:
  policy: contribution_tilt      # contribution_tilt | hard
  bands:                      # TODO: adjust to your horizon
    - age_min: 45
      age_max: 50
      a: 0
      b: 0
      c: 0
      d: 0
      z: 0

# ── Contributions ──────────────────────────────────────────────────────────
monthly_dca: 0                # TODO: current monthly contribution
dca_step_up: "min(salary growth, 5%)"   # never decrease
dca_review_month: 1

# ── Current Bull–Bear Index ────────────────────────────────────────────────
bbi:
  as_of: "YYYY-MM-DD"
  market_valuation: 0         # TODO 0-100, higher = more bearish
  portfolio_valuation: 0
  macro_liquidity: 0
  technical: 0
  opportunity: 0
  weighted: 0                 # 0.30/0.25/0.20/0.15/0.10
  band: ""                    # Risk-On | Constructive | Cautious | Defensive

# ── Positions ──────────────────────────────────────────────────────────────
positions:
  - ticker: "EXAMPLE-A1"
    sleeve: a                 # a | b | c | d | z
    shares: 0
    avg_cost: 0
    market_price: 0
    market_value: 0
    us_situs: false           # true if US-domiciled ETF or US corporation

# ── Cash ───────────────────────────────────────────────────────────────────
cash:
  balance: 0                  # uninvested broker cash
  vehicles:
    - pool: "z-main"
      ticker: "EXAMPLE-Z1"
      duration_years: 0

# ── Computed (do not hand-edit) ────────────────────────────────────────────
portfolio_total: 0            # Σ market_value + cash
reconciliation_delta: 0       # nlv − portfolio_total (≤ ±1.00)
