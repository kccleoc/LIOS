# LIOS v3.0 — Synthetic Example State
# Fully fabricated demo. Every ticker is EXAMPLE-*; every number is invention.
# Use this as a worked reference, never as a template for real data.

version: "v3.0"
nlv: 1000000
as_of: "2026-01-01"
source: "synthetic"

sleeves:
  a:
    target_pct: 67
    allocation:
      - ticker: "EXAMPLE-A1"
        target_pct: 62.5
      - ticker: "EXAMPLE-A2"
        target_pct: 37.5
  b:
    target_pct: 8
    position_cap_pct: 10
    names:
      - ticker: "EXAMPLE-B1"
        target_pct: 33.33
      - ticker: "EXAMPLE-B2"
        target_pct: 33.33
      - ticker: "EXAMPLE-B3"
        target_pct: 33.34
  c:
    target_pct: 5
    ceiling_pct: 7
    max_names: 6
  d:
    target_pct: 15
    instrument: "EXAMPLE-D"
  z:
    target_pct: 5
    floor_pct: 3
    ceiling_pct: 8

constraints:
  factor_cap_pct: 25
  risky_min_pct: 60
  risky_max_pct: 80
  # bands are computed: clamp(0.5 × target, 2pp, 8pp)
  us_situs_ceiling: 60000
  us_situs_exposure: 80000

glidepath:
  policy: contribution_tilt
  bands:
    - { age_min: 45, age_max: 50, a: 67, b: 8, c: 5, d: 15, z: 5 }
    - { age_min: 50, age_max: 55, a: 64, b: 6, c: 5, d: 20, z: 5 }
    - { age_min: 55, age_max: 60, a: 62, b: 3, c: 5, d: 25, z: 5 }
    - { age_min: 60, age_max: 65, a: 60, b: 0, c: 5, d: 30, z: 5 }
    - { age_min: 65, age_max: 99, a: 55, b: 0, c: 5, d: 35, z: 5 }

monthly_dca: 10000
dca_step_up: "min(salary growth, 5%)"
dca_review_month: 1

bbi:
  as_of: "2026-01-01"
  market_valuation: 60
  portfolio_valuation: 55
  macro_liquidity: 50
  technical: 45
  opportunity: 55
  weighted: 54.75
  band: Cautious

positions:
  - { ticker: "EXAMPLE-A1", sleeve: a, shares: 3000, avg_cost: 100, market_price: 138, market_value: 414000, us_situs: false }
  - { ticker: "EXAMPLE-A2", sleeve: a, shares: 2000, avg_cost: 150, market_price: 124, market_value: 248000, us_situs: false }
  - { ticker: "EXAMPLE-B1", sleeve: b, shares: 500, avg_cost: 80, market_price: 96, market_value: 48000, us_situs: true }
  - { ticker: "EXAMPLE-B2", sleeve: b, shares: 300, avg_cost: 120, market_price: 108, market_value: 32400, us_situs: true }
  - { ticker: "EXAMPLE-B3", sleeve: b, shares: 800, avg_cost: 60, market_price: 55, market_value: 44000, us_situs: false }
  - { ticker: "EXAMPLE-C1", sleeve: c, shares: 400, avg_cost: 40, market_price: 50, market_value: 20000, us_situs: false }
  - { ticker: "EXAMPLE-C2", sleeve: c, shares: 600, avg_cost: 30, market_price: 27, market_value: 16200, us_situs: false }
  - { ticker: "EXAMPLE-D", sleeve: d, shares: 1500, avg_cost: 95, market_price: 100, market_value: 150000, us_situs: false }
  - { ticker: "EXAMPLE-Z1", sleeve: z, shares: 1200, avg_cost: 100, market_price: 100, market_value: 120000, us_situs: true }

cash:
  balance: 0
  vehicles:
    - { pool: "z-main", ticker: "EXAMPLE-Z1", duration_years: 0 }

portfolio_total: 1000000
reconciliation_delta: 0

# Notes on this synthetic book:
# - Sleeve B is 12.4% of NLV (over the 8% target) — the DCA waterfall gives B
#   zero allocation until it falls back to target.
# - Sleeve Z is 12% (over the 5% target and over the 8% ceiling) — the rebalance
#   rule is triggered and must redeploy toward D.
# - us_situs_exposure is over the ceiling and must be reduced.
# - Total risky is 81.2%, above the 80% glidepath ceiling — the next rebalance
#   moves money from A/B/C into D/Z.
