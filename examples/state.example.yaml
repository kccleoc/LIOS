# LIOS v5.0 — Synthetic Example State
# Fully fabricated demo. Every ticker is EXAMPLE-*; every number is invention.
# Use this as a worked reference, never as a template for real data.

version: "v5.0"
nlv: 1000000
as_of: "2026-01-01"
source: "synthetic"

sleeves:
  a:
    target_pct: 66            # residual: risky 80 − B actual 13.4; recomputed each cycle
    thematic_max_pct: 25      # thematic share of sleeve A
    allocation:
      - ticker: "EXAMPLE-A1"
        target_pct: 75
      - ticker: "EXAMPLE-A2"
        target_pct: 25
  b:
    ceiling_pct: 10           # soft ceiling; no target, no Top-up
    position_cap_pct: 5
    names:
      - ticker: "EXAMPLE-B1"
      - ticker: "EXAMPLE-B2"
      - ticker: "EXAMPLE-B3"
  c:
    target_pct: 15
    instrument: "EXAMPLE-C1"
  z:
    target_pct: 5
    floor_pct: 3
    ceiling_pct: 10

constraints:
  lookthrough_company_cap_pct: 5
  factor_cap_pct: 25
  rebalance_tolerance_pct: 2.5
  # sleeve bands are computed: clamp(0.5 × target, 2pp, 8pp)
  us_situs_ceiling: 110000
  us_situs_exposure: 91000

glidepath:
  policy: contribution_tilt
  bands:
    - { age_min: 45, age_max: 50, risky: 80, b_ceiling: 10, c: 15, z: 5 }
    - { age_min: 50, age_max: 55, risky: 75, b_ceiling: 8, c: 20, z: 5 }
    - { age_min: 55, age_max: 60, risky: 70, b_ceiling: 5, c: 25, z: 5 }
    - { age_min: 60, age_max: 65, risky: 65, b_ceiling: 0, c: 30, z: 5 }
    - { age_min: 65, age_max: 99, risky: 60, b_ceiling: 0, c: 35, z: 5 }

monthly_dca: 10000
dca_step_up: "min(salary growth, 5%)"
dca_review_month: 1

bbi:
  as_of: "2026-01-01"
  market_valuation: 60
  portfolio_valuation: 55
  macro_liquidity: 50
  technical: 45
  opportunity: 55
  weighted: 54.75
  band: Cautious

positions:
  - { ticker: "EXAMPLE-A1", sleeve: a, shares: 3500, avg_cost: 100, market_price: 140, market_value: 490000, us_situs: false }
  - { ticker: "EXAMPLE-A2", sleeve: a, shares: 1000, avg_cost: 120, market_price: 154, market_value: 154000, us_situs: false }
  - { ticker: "EXAMPLE-B1", sleeve: b, shares: 600, avg_cost: 60, market_price: 80, market_value: 48000, us_situs: true }
  - { ticker: "EXAMPLE-B2", sleeve: b, shares: 500, avg_cost: 70, market_price: 86, market_value: 43000, us_situs: true }
  - { ticker: "EXAMPLE-B3", sleeve: b, shares: 860, avg_cost: 40, market_price: 50, market_value: 43000, us_situs: false }
  - { ticker: "EXAMPLE-C1", sleeve: c, shares: 1500, avg_cost: 95, market_price: 100, market_value: 150000, us_situs: false }
  - { ticker: "EXAMPLE-Z1", sleeve: z, shares: 720, avg_cost: 100, market_price: 100, market_value: 72000, us_situs: false }

cash:
  balance: 0
  vehicles:
    - { pool: "z-main", ticker: "EXAMPLE-Z1", duration_years: 0 }

portfolio_total: 1000000
reconciliation_delta: 0

# Notes on this synthetic book:
# - Sleeve B is 13.4% of NLV against a 10% ceiling — 3.4pp beyond the 2.5pp
#   tolerance. This is the soft-breach case: flagged every cycle, and the
#   largest position (EXAMPLE-B1) is trimmed at the next quarterly Rebalance.
#   B receives no Top-up in the meantime; B has no target, only the ceiling.
# - risky_now = (A + B) / NLV = 77.8%, below the 80% glidepath weight for the
#   45–50 band. C is bonds and is not counted as risky.
# - Sleeve A target is the residual: 80 − 13.4 = 66.6%; actual 64.4% is inside
#   its ±8pp band. Thematic share (EXAMPLE-A2) is 23.9% of A, inside the 25% cap.
# - Sleeve C is at its 15% target. Bonds are not ranked — no rotation, no
#   Replacement Index in C.
# - Sleeve Z is inside its band (±2.5pp around 5%) and above its 3% floor —
#   no action.
# - us_situs_exposure is 91,000 against a 110,000 ceiling — past the 80%
#   early-warning line (88,000): stop adding, prefer non-US domiciles.
# - Look-through: the largest single-company exposure is 4.7% of NLV (the
#   direct holding EXAMPLE-B2 plus its index-embedded weight inside
#   EXAMPLE-A1) against the 5% cap — inside, reported.
